<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070710">
  <meta name="robots" content="noindex">
  <title>ETD_08 | Redirecting</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; min-height: 100vh;
      background: #070710; color: #f4f2ff;
      font: 500 14px/1.5 Inter, system-ui, sans-serif;
      letter-spacing: .12em; text-align: center;
    }
    .status { opacity: .75; }
    .brand { display: block; margin-bottom: 12px; font-size: 28px; font-weight: 800; letter-spacing: .08em; }
    .brand span { color: #9b5cff; }
  </style>
  <script>
    (() => {
      // Screens up to 767px wide use the mobile-optimised hub.
      const isMobileLayout = window.matchMedia('(max-width: 767px)').matches;
      const destination = isMobileLayout
        ? './Website%20Link%20Hub%20-%20Mobile%20version/'
        : './Website%20Link%20Hub%20-%20Desktop%20version/';
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <div>
    <span class="brand">ETD<span>_08</span></span>
    <div class="status">SELECTING YOUR INTERFACE…</div>
    <noscript>
      <p>JavaScript is required for automatic device selection.</p>
      <p><a href="./Website%20Link%20Hub%20-%20Mobile%20version/">Mobile Hub</a> · <a href="./Website%20Link%20Hub%20-%20Desktop%20version/">Desktop Hub</a></p>
    </noscript>
  </div>
</body>
</html>
